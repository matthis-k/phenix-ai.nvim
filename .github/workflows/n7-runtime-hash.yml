name: N7 merged runtime NAR hash (temporary)
on:
  pull_request:
    paths: ['.github/workflows/n7-runtime-hash.yml']
permissions: {contents: read}
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: cachix/install-nix-action@v31
      - name: Measure exact merged revision
        run: |
          set -euo pipefail
          rev=e63ed747e0b7b3c60de66b041d39c017c015fb8a
          nix flake metadata --json --refresh "github:matthis-k/phenix-ai/$rev" > "$RUNNER_TEMP/merged.json"
          jq -e --arg rev "$rev" '.locked.rev == $rev' "$RUNNER_TEMP/merged.json"
          jq -c '{locked:.locked}' "$RUNNER_TEMP/merged.json"
