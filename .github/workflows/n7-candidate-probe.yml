name: N7 candidate runtime probe (temporary)
on:
  pull_request:
    paths:
      - ".github/workflows/n7-candidate-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Probe exact runtime candidate and native client package
        env:
          CANDIDATE: 55df52073b4fe97b886394c83c53042613676e5b
        run: |
          set -euo pipefail
          nix flake metadata --json --refresh "github:matthis-k/phenix-ai/$CANDIDATE" > "$RUNNER_TEMP/runtime-metadata.json"
          jq -e --arg rev "$CANDIDATE" '.locked.rev == $rev and (.locked.narHash | startswith("sha256-"))' "$RUNNER_TEMP/runtime-metadata.json"
          jq -c '{locked: .locked}' "$RUNNER_TEMP/runtime-metadata.json"
          nix build -L --no-link --show-trace --override-input phenix-ai "github:matthis-k/phenix-ai/$CANDIDATE" '.#checks.x86_64-linux.p1-openai-api-client'
          nix build -L --no-link --show-trace --override-input phenix-ai "github:matthis-k/phenix-ai/$CANDIDATE" '.#packages.x86_64-linux.phenix-ai-nvim-openai-api'
