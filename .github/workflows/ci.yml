name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Resolve phenix-ai lock diagnostic
        run: |
          nix flake lock --update-input phenix-ai
          echo '---BEGIN-LOCK---'
          cat flake.lock
          echo '---END-LOCK---'
          exit 1
