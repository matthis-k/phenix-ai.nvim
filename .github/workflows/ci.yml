name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Materialize propagated lock
        run: |
          nix flake lock --update-input phenix-ai
          echo "===FLAKE_LOCK_BEGIN==="
          cat flake.lock
          echo "===FLAKE_LOCK_END==="
      - run: nix flake check --no-update-lock-file --show-trace
