name: Temporary Phenix AI lock sync

on:
  push:
    branches:
      - chore/propagate-phenix-ai-577

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/propagate-phenix-ai-577
      - uses: cachix/install-nix-action@v31
      - name: Update Phenix AI input
        run: nix flake update phenix-ai
      - name: Commit authoritative lock
        run: |
          if git diff --quiet -- flake.lock; then
            echo "flake.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore: refresh merged Phenix AI runtime"
          git push origin HEAD:chore/propagate-phenix-ai-577
