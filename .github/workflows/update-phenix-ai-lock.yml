name: Update Phenix AI lock

on:
  push:
    branches:
      - fix/transcript-tool-disclosure-scroll

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/transcript-tool-disclosure-scroll
      - uses: cachix/install-nix-action@v31
      - name: Update phenix-ai input
        run: nix flake lock --update-input phenix-ai
      - name: Commit lock update
        run: |
          set -euo pipefail
          if git diff --quiet -- flake.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "Propagate phenix-ai d5855911"
          git push origin HEAD:fix/transcript-tool-disclosure-scroll
