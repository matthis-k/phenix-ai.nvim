name: Update Phenix AI lock

on:
  push:
    branches:
      - propagate/context-observability-815627f9

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: propagate/context-observability-815627f9
      - uses: cachix/install-nix-action@v31
      - name: Update phenix-ai input
        run: nix flake lock --update-input phenix-ai
      - name: Commit lock
        run: |
          if git diff --quiet -- flake.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore: update phenix-ai lock"
          git push
